ce;background:var(--blue-bg);padding:3px 8px;border-radius:6px}.checklist-scroll{max-height:200px;overflow:auto;background:var(--blue-bg);padding:12px;border-radius:12px}.checklist-scroll label{display:flex;align-items:center;gap:8px;padding:5px}.pre{white-space:pre-wrap;overflow-wrap:anywhere}.deadline{font-weight:600;color:var(--blue-800)}.deadline.expired{color:var(--danger)}summary{cursor:pointer;color:var(--blue-800);font-weight:600}details{margin:12px 0}fieldset{border:0;padding:0;margin:0;min-width:0}.foot{text-align:center;padding:20px;color:var(--muted);font-size:12px}.announcement{border-left:4px solid var(--orange)}.score-ring{width:135px;height:135px;border-radius:50%;background:conic-gradient(var(--blue-600) calc(var(--pct)*1%),var(--blue-100) 0);display:grid;place-items:center;margin:22px auto}.score-ring-inner{width:108px;height:108px;background:white;border-radius:50%;display:grid;place-content:center;font-size:26px;font-weight:700;color:var(--blue-800)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue-800);color:white;border-radius:12px;padding:12px 20px;z-index:100;max-width:90vw;box-shadow:var(--shadow)}#camera-dialog{border:1px solid var(--line);border-radius:20px;max-width:94vw;width:450px}#camera-dialog::backdrop{background:#10233a99}video{width:100%;border-radius:12px;background:#000}.chart{width:100%;height:220px}.chart text{font-family:Arial,sans-serif}.opt-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:860px){.shell{flex-direction:column}.side-nav{width:100%;height:auto;position:static;padding:12px 14px}.side-nav .brand{padding:0 0 10px}.side-role{display:none}.side-nav-links{display:flex;overflow-x:auto;gap:4px}.side-nav-links button{width:auto}.side-foot{justify-content:flex-end;padding:8px 0 0;margin:4px 0 0}.side-foot .avatar{display:none}main{padding:20px 16px 36px}.hero{padding:25px}.hero-illustration{display:none}.card{padding:18px}.auth-card{padding:26px}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-num{font-size:21px}}

<body>
<div id="app"></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<dialog id="camera-dialog"><h3>Foto Jawaban</h3><video id="camera-video" autoplay playsinline></video><p id="camera-error" class="error hidden"></p><div class="row"><button type="button" class="btn-accent" data-action="capture">📸 Ambil Foto</button><button type="button" class="btn-secondary" data-action="close-camera">Tutup</button></div></dialog>
<script>
'use strict';
/* ElearnMath, satu file mandiri. Data menggunakan localStorage pada browser ini.
   Tetap membaca elearnmath_state_v1 dari versi sebelumnya pada origin yang sama.
   Role di aplikasi lokal adalah alur antarmuka, bukan otorisasi server.
   Setiap perubahan penting disimpan langsung; tidak ada layanan AI eksternal. */
const STORAGE_KEY='elearnmath_state_v1', SESSION_KEY='elearnmath_session_v1';
const ADMIN_EMAIL_DOMAIN='@students.um.ac.id';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const clone=value=>JSON.parse(JSON.stringify(value));
const labels={lkpd:'LKPD',latihan:'Latihan',evaluasi:'Evaluasi'};
const roles={siswa:'Siswa',guru:'Guru',admin:'Admin'};
const religions=['Islam','Kristen','Katolik','Hindu','Buddha','Konghucu','Lainnya'];
const defaultState={
 users:{admins:[],gurus:[],siswas:[]},registeredEmails:[],flagged:[],classes:[],submissions:{},progress:{},grades:{},drafts:{},announcements:[],settings:{lkpdPassingGrade:75,evaluasiDeadline:null},googleSheet:{webAppUrl:'',lastSync:null},
 materi:[
 {id:'m1',icon:'📊',title:'Mengenal Jenis Data',desc:'Memahami perbedaan data kualitatif dan kuantitatif melalui contoh sehari-hari.',subbab:['Data Kualitatif','Data Kuantitatif','Contoh dalam Kehidupan Sehari-hari'],yt:null},
 {id:'m2',icon:'📈',title:'Penyajian Data',desc:'Belajar menyajikan data dalam bentuk tabel dan diagram.',subbab:['Tabel Data','Diagram Batang','Diagram Lingkaran'],yt:'https://www.youtube.com/results?search_query=penyajian+data+matematika'},
 {id:'m3',icon:'📐',title:'Ukuran Pemusatan Data',desc:'Mengenal mean, median, dan modus sebagai ukuran pemusatan data.',subbab:['Mean (Rata-rata)','Median','Modus'],yt:null}],
 kpd:[{type:'pg',format:'text',prompt:'Warna kesukaan siswa termasuk jenis data...',media:'',opts:['Data kualitatif','Data kuantitatif','Data campuran','Bukan data'],correct:0},
 {type:'essay',format:'text',prompt:'Jelaskan perbedaan data kualitatif dan data kuantitatif menurut pemahamanmu.',media:'',opts:[],correct:0}],
 latihan:[
 {type:'pg',format:'text',prompt:'Warna kesukaan siswa termasuk jenis data...',media:'',opts:['Data kualitatif','Data kuantitatif','Data campuran','Bukan data'],correct:0,feedbackCorrect:'Benar! 🎉 Warna kesukaan merupakan data kualitatif.',feedbackWrong:'Jawaban yang tepat: Data kualitatif, karena berupa kategori bukan angka.'},
 {type:'pg',format:'text',prompt:'Tinggi badan siswa (dalam cm) termasuk jenis data...',media:'',opts:['Data kualitatif','Data kuantitatif','Data nominal','Bukan data'],correct:1,feedbackCorrect:'Benar! 🎉 Tinggi badan berupa angka sehingga termasuk data kuantitatif.',feedbackWrong:'Jawaban yang tepat: Data kuantitatif, karena dinyatakan dalam bentuk angka.'},
 {type:'pg',format:'text',prompt:'Diagram yang paling tepat untuk menampilkan perbandingan persentase adalah...',media:'',opts:['Diagram batang','Diagram lingkaran','Diagram garis','Tabel frekuensi'],correct:1,feedbackCorrect:'Benar! 🎉 Diagram lingkaran cocok untuk menunjukkan perbandingan persentase.',feedbackWrong:'Jawaban yang tepat: Diagram lingkaran, karena menunjukkan proporsi dari keseluruhan.'},
 {type:'pg',format:'text',prompt:'Nilai yang paling sering muncul dalam sekumpulan data disebut...',media:'',opts:['Mean','Median','Modus','Range'],correct:2,feedbackCorrect:'Benar! 🎉 Nilai yang paling sering muncul disebut modus.',feedbackWrong:'Jawaban yang tepat: Modus, yaitu nilai dengan frekuensi kemunculan terbanyak.'},
 {type:'essay',format:'text',prompt:'Menurutmu, mengapa memilih jenis diagram yang tepat penting saat menyajikan data hasil survei kelas? Jelaskan dengan contoh.',media:'',opts:[],correct:0}],
 evaluasi:[
 {type:'essay',format:'text',prompt:'Jelaskan perbedaan data kualitatif dan data kuantitatif, lalu berikan masing-masing satu contoh dari lingkungan sekolahmu.',media:'',opts:[],correct:0},
 {type:'essay',format:'text',prompt:'Sebuah survei mencatat warna favorit 20 siswa. Jelaskan diagram apa yang paling tepat digunakan dan alasannya.',media:'',opts:[],correct:0},
 {type:'essay',format:'text',prompt:'Diketahui nilai ulangan 5 siswa: 80, 90, 70, 90, 85. Tentukan mean dan modus dari data tersebut, sertakan cara mengerjakannya.',media:'',opts:[],correct:0}]
};
let state=clone(defaultState),session=null,page='login',authRole='siswa',editId=null,currentMaterial=null,questionDraft=null,activeSection=null,cameraStream=null,cameraTarget=null;
let storageBroken=false,toastTimer;
function notify(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),5000)}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch(e){notify('Data belum tersimpan: penyimpanan browser penuh atau diblokir. Kurangi foto atau ekspor cadangan.');return false}}
function normalizeState(data){
 const s=Object.assign(clone(defaultState),data);
 s.users=Object.assign({admins:[],gurus:[],siswas:[]},s.users||{});
 for(const key of ['admins','gurus','siswas'])if(!Array.isArray(s.users[key]))s.users[key]=[];
 for(const key of ['materi','kpd','latihan','evaluasi','classes','flagged','announcements'])if(!Array.isArray(s[key]))s[key]=[];
 for(const key of ['progress','grades','submissions','drafts'])s[key]=s[key]||{};
 s.settings=Object.assign({lkpdPassingGrade:75,evaluasiDeadline:null},s.settings||{});
 if(!Number.isFinite(Number(s.settings.lkpdPassingGrade))||Number(s.settings.lkpdPassingGrade)<0||Number(s.settings.lkpdPassingGrade)>100)s.settings.lkpdPassingGrade=75;
 s.settings.lkpdPassingGrade=Number(s.settings.lkpdPassingGrade);
 s.googleSheet=Object.assign({webAppUrl:'',lastSync:null},s.googleSheet||{});
 s.materi.forEach(m=>{m.id=m.id||uid();m.subbab=m.subbab||[];m.links=parseLinks(m.links??m.yt??'')});
 ['kpd','latihan','evaluasi'].forEach(k=>s[k].forEach(q=>q.id=q.id||uid()));
 Object.values(s.users).flat().forEach(u=>{u.kelas=u.kelas||'';u.agama=u.agama||'';u.jenisKelamin=u.jenisKelamin||''});
 s.classes.forEach(c=>c.studentUsernames=c.studentUsernames||[]);
 return s;
}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state=normalizeState(JSON.parse(raw));else state=normalizeState(state)}catch(e){storageBroken=true;state=normalizeState(state)}}
function store(role){return state.users[{admin:'admins',guru:'gurus',siswa:'siswas'}[role]]||[]}
function own(){return session?store(session.role).find(u=>u.username===session.username):null}
function isStaff(){return !!session&&['guru','admin'].includes(session.role)}
function requireRole(...allowed){if(!session||!own()||!allowed.includes(session.role)){notify('Akses tidak diizinkan.');return false}return true}
function getProgress(u){return state.progress[u]||(state.progress[u]={materiRead:[],kpdDone:false,latihanDone:false,evaluasiDone:false})}
function getGrades(u){return state.grades[u]||(state.grades[u]={lkpd:null,latihan:null,evaluasi:null})}
function getSubmission(u,section){return state.submissions[u]?.[section]||null}
function pendingEssays(u,section){return Object.values(getSubmission(u,section)?.essays||{}).some(e=>!e.corrected||e.score===null||e.score===undefined||e.score==='')}
function finalGrade(u,section){if(pendingEssays(u,section))return null;const v=getGrades(u)[section];return v===null||v===undefined||v===''?null:Number(v)}
function recomputeFinalGrade(u,section){
 const sub=getSubmission(u,section);if(!sub)return null;
 const essays=Object.values(sub.essays||{});
 if(pendingEssays(u,section)){getGrades(u)[section]=null;return null}
 const parts=[];if(sub.pgScore!==null&&sub.pgScore!==undefined)parts.push(Number(sub.pgScore));
 if(essays.length)parts.push(essays.reduce((a,e)=>a+Number(e.score),0)/essays.length);
 const score=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):null;
 getGrades(u)[section]=score;return score;
}
function allMateriRead(u){return state.materi.length>0&&state.materi.every(m=>getProgress(u).materiRead.includes(m.id))}
function lkpdPassed(u){const score=finalGrade(u,'lkpd');return getProgress(u).kpdDone&&score!==null&&score>=state.settings.lkpdPassingGrade}
function gateReason(section,u=session?.username){
 if(!u)return 'Silakan login sebagai siswa.';
 if(section==='lkpd'&&!allMateriRead(u))return 'Baca seluruh materi terlebih dahulu sebelum mengerjakan LKPD.';
 if(section==='latihan'&&!lkpdPassed(u)){
  if(!getProgress(u).kpdDone)return 'Kirim jawaban LKPD terlebih dahulu. Nilai minimal untuk membuka latihan: '+state.settings.lkpdPassingGrade+'.';
  if(finalGrade(u,'lkpd')===null)return 'Nilai LKPD masih menunggu koreksi guru. Latihan terbuka setelah nilai final minimal '+state.settings.lkpdPassingGrade+'.';
  return 'Nilai LKPD kamu '+finalGrade(u,'lkpd')+'. Batas ketuntasan '+state.settings.lkpdPassingGrade+'. Perbaiki LKPD sebelum membuka latihan.';
 }
 if(section==='evaluasi'&&(!getProgress(u).latihanDone||!lkpdPassed(u)))return 'Tuntaskan LKPD sesuai batas nilai dan selesaikan latihan sebelum evaluasi.';
 return '';
}
function deadlinePassed(){return !!state.settings.evaluasiDeadline&&Date.now()>=new Date(state.settings.evaluasiDeadline).getTime()}
function dateText(value){if(!value)return 'Tidak dibatasi';return new Date(value).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}
function localDateValue(value){if(!value)return '';const d=new Date(value);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function parseLinks(value){return [...new Set((Array.isArray(value)?value:String(value||'').split(/\r?\n/)).map(v=>{const text=String(v).trim();const match=text.match(/^\[([^\]]+)\]\(([^)]+)\)$/);return match?match[2].replace(/\\/g,''):text}).filter(Boolean))]}
function safeURL(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function safeImage(value){return /^data:image\/(png|jpeg|webp|gif);base64,[a-z\d+/=]+$/i.test(value||'')?value:safeURL(value)}
function linksHTML(m){return (m.links||[]).filter(safeURL).map((link,i)=>`<a class="btn-secondary" href="${esc(safeURL(link))}" target="_blank" rel="noopener noreferrer">🔗 Buka Materi ${i+1}</a>`).join(' ')}
function mediaHTML(q){if(!q.media)return '';if(q.format==='image'&&safeImage(q.media))return `<div class="soal-media-preview"><img src="${esc(safeImage(q.media))}" alt="Gambar soal"></div>`;if(q.format==='video'&&safeURL(q.media))return `<p><a href="${esc(safeURL(q.media))}" target="_blank" rel="noopener noreferrer">▶ Buka video soal</a></p>`;return ''}
function field(name,label,value='',type='text',extra=''){return `<div class="field"><label for="${esc(name)}">${label}</label><input id="${esc(name)}" name="${esc(name)}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function area(name,label,value='',extra=''){return `<div class="field"><label for="${esc(name)}">${label}</label><textarea id="${esc(name)}" name="${esc(name)}" rows="3" ${extra}>${esc(value)}</textarea></div>`}
function select(name,label,options,value='',required=false){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}" ${required?'required':''}><option value="">Pilih ${label.toLowerCase()}</option>${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function button(action,label,cls='btn-primary',data=''){return `<button type="button" class="${cls}" data-action="${action}" ${data}>${label}</button>`}
function empty(text){return `<div class="empty-state">${text}</div>`}
function header(title,sub='',eyebrow=''){return `${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h2>${title}</h2>${sub?`<p class="section-sub">${sub}</p>`:''}`}
function errorBox(){return '<div id="form-error" class="error hidden" role="alert"></div>'}
function formError(text){const el=$('form-error');if(el){el.textContent=text;el.classList.remove('hidden')}else notify(text)}
function classNames(text){return String(text||'').split(',').map(v=>v.trim()).filter(Boolean)}
function normClass(name){return name.trim().toLocaleLowerCase('id-ID')}
function studentClasses(u){const rec=store('siswa').find(s=>s.username===u);return [...new Set([...classNames(rec?.kelas),...state.classes.filter(c=>c.studentUsernames.includes(u)).map(c=>c.name)])]}
function teacherStudents(){
 if(session?.role==='admin')return store('siswa');
 const teacher=own();if(!teacher)return [];
 const managed=state.classes.filter(c=>c.teacherUsername===teacher.username);
 const names=new Set([...classNames(teacher.kelas),...managed.map(c=>c.name)].map(normClass));
 const assigned=new Set(managed.flatMap(c=>c.studentUsernames));
 return store('siswa').filter(s=>assigned.has(s.username)||studentClasses(s.username).some(k=>names.has(normClass(k))));
}
function canViewStudent(u){return isStaff()&&(session.role==='admin'||teacherStudents().some(s=>s.username===u))}
const menus={
 siswa:[['home','🏠','Beranda'],['materi','📚','Materi'],['lkpd','📝','LKPD'],['latihan','✏️','Latihan'],['evaluasi','🎯','Evaluasi'],['tentang','👩‍🏫','Tentang'],['profile','👤','Profil Saya']],
 guru:[['home','🏠','Dashboard'],['materi-editor','📚','Kelola Materi'],['kpd-editor','📝','Kelola LKPD'],['latihan-editor','✏️','Kelola Latihan'],['evaluasi-editor','🎯','Kelola Evaluasi'],['nilai','📊','Nilai & Sinkron'],['jadwal','🗓️','Jadwal Pelajaran'],['deteksi','⚠️','Deteksi Keluar Tab'],['koreksi','🤖','Koreksi Essay'],['profile','👤','Profil Saya']],
 admin:[['home','🏠','Ringkasan'],['kelas','🏫','Kelola Kelas'],['siswa-editor','➕','Tambah Siswa'],['guru-editor','➕','Tambah Guru'],['users','🗂️','Data Pengguna'],['deteksi','⚠️','Deteksi Keluar Tab'],['profile','👤','Profil Saya']]
};
function allowedPage(target){if(!session)return false;if(menus[session.role].some(x=>x[0]===target))return true;return session.role==='siswa'&&['materi-detail','result'].includes(target)}
function go(target){if(!session||!own()){session=null;renderAuth();return}if(!allowedPage(target)){notify('Akses tidak diizinkan.');return}stopCamera();activeSection=null;page=target;editId=null;questionDraft=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
 if(!session||!own()){renderAuth();return}
 const user=own();
 $('app').innerHTML=`<div class="shell"><aside class="side-nav"><div class="brand"><div class="logo-badge">∑</div><div class="logo-text">Elearn<span>Math</span></div></div><div class="side-role"><span class="badge badge-blue">${roles[session.role]}</span></div><nav class="side-nav-links" aria-label="Navigasi utama">${menus[session.role].map(([id,icon,label])=>`<button type="button" data-action="nav" data-page="${id}" class="${page===id?'active ':''}${session.role==='siswa'&&['lkpd','latihan','evaluasi'].includes(id)&&gateReason(id)?'locked':''}">${icon} ${label}${session.role==='siswa'&&['lkpd','latihan','evaluasi'].includes(id)&&gateReason(id)?' 🔒':''}</button>`).join('')}</nav><div class="side-foot"><div class="avatar">${esc(user.namaLengkap.charAt(0).toUpperCase())}</div><div><div class="side-foot-name">${esc(user.namaLengkap)}</div><button type="button" class="logout" data-action="logout">Keluar</button></div></div></aside><div class="shell-main"><main id="content"></main><footer class="foot">ElearnMath · Prototype e-learning matematika interaktif<br>Data tersimpan di browser ini; belum tersinkron antarperangkat.</footer></div></div>`;
 let html='';
 if(page==='home')html=session.role==='siswa'?studentHome():session.role==='guru'?teacherHome():adminHome();
 else if(page==='materi')html=materialList();
 else if(page==='materi-detail')html=materialDetail();
 else if(page==='materi-editor')html=materialEditor();
 else if(['kpd-editor','latihan-editor','evaluasi-editor'].includes(page))html=questionEditor(page.replace('-editor',''));
 else if(['lkpd','latihan','evaluasi'].includes(page))html=assessmentPage(page);
 else if(page==='result')html=resultPage();
 else if(page==='profile')html=profilePage();
 else if(page==='users')html=usersPage();
 else if(['siswa-editor','guru-editor'].includes(page))html=userEditor(page.replace('-editor',''));
 else if(page==='kelas')html=classesPage();
 else if(page==='nilai')html=gradesPage();
 else if(page==='jadwal')html=schedulePage();
 else if(page==='deteksi')html=detectionPage();
 else if(page==='koreksi')html=correctionPage();
 else if(page==='tentang')html=aboutPage();
 $('content').innerHTML=html;
 updateDeadlineUI();
}
function renderAuth(mode='choose',role=authRole){
 activeSection=null;authRole=role;stopCamera();
 let body='';
 if(mode==='choose')body=`<p class="muted">Masuk sesuai peranmu untuk mulai belajar matematika</p><div class="grid" style="gap:10px">${Object.entries(roles).map(([r,label])=>button('login-page',(r==='siswa'?'🎓 ':r==='guru'?'👩‍🏫 ':'🛠️ ')+'Masuk sebagai '+label,r==='siswa'?'btn-primary wide':'btn-secondary wide',`data-role="${r}"`)).join('')}</div><div class="auth-switch">Belum punya akun? ${button('register-page','Daftar di sini','text-btn','data-role="siswa"')}</div>`;
 if(mode==='login')body=`<p class="muted">Login ${roles[role]}</p><form id="login-form" data-role="${role}">${field('username','Username','','text','required autocomplete="username"')}${field('password','Password','','password','required autocomplete="current-password"')}${errorBox()}<button class="btn-primary wide" type="submit">Login ${roles[role]}</button></form><div class="auth-switch">Belum punya akun? ${button('register-page','Daftar sebagai '+roles[role],'text-btn',`data-role="${role}"`)}</div><div class="auth-switch">${button('auth-back','← Kembali ke pilihan peran','text-btn')}</div>`;
 if(mode==='register')body=`<p class="muted">Buat akun baru</p><form id="register-form"><div class="field"><label for="reg-role">Daftar sebagai</label><select id="reg-role" name="role">${Object.entries(roles).map(([r,l])=>`<option value="${r}" ${r===role?'selected':''}>${l}</option>`).join('')}</select></div>${field('namaLengkap','Nama Lengkap','','text','required')}${role==='admin'?field('email','Email khusus admin','','email','required placeholder="nama@students.um.ac.id"')+'<p class="hint-text">Gunakan domain @students.um.ac.id.</p>':field('kelas',role==='guru'?'Kelas yang Diampu':'Kelas','','text',`required placeholder="${role==='guru'?'VII-A, VII-B':'VII-A'}"`)+'<p class="hint-text">Ketik nama kelas secara manual.'+(role==='guru'?' Pisahkan beberapa kelas dengan koma.':' Samakan penulisan dengan kelas gurumu.')+'</p>'}${role!=='siswa'?`<div class="form-grid">${select('jenisKelamin','Jenis Kelamin',['Laki-laki','Perempuan'],'',true)}${select('agama','Agama',religions,'',true)}</div>`:''}${field('username','Username','','text','required autocomplete="username" pattern="[A-Za-z0-9_.-]+" title="Gunakan huruf, angka, titik, garis bawah, atau tanda hubung"')}${field('password','Password','','password','required autocomplete="new-password"')}${errorBox()}<button class="btn-primary wide" type="submit">Daftar</button></form><div class="auth-switch">${button('login-page','Sudah punya akun? Login','text-btn',`data-role="${role}"`)}</div>`;
 $('app').innerHTML=`<section class="center-shell"><div class="card auth-card"><div class="brand"><div class="logo-badge">∑</div><div class="logo-text">Elearn<span>Math</span></div></div>${body}<div class="note">Akun dan data disimpan di browser perangkat ini. Gunakan data demonstrasi untuk mencoba aplikasi.</div>${storageBroken?'<div class="error">Data tersimpan tidak dapat dibaca. Cadangkan data browser sebelum melanjutkan.</div>':''}</div></section>`;
}
function usernameValid(u,exclude){return /^[A-Za-z0-9_.-]+$/.test(u)&&!Object.values(state.users).flat().some(r=>r!==exclude&&r.username.toLowerCase()===u.toLowerCase())}
function doLogin(form){const data=Object.fromEntries(new FormData(form)),role=form.dataset.role;const user=store(role).find(u=>u.username===data.username.trim()&&u.password===data.password);if(!user){formError('Username atau password salah, atau akun belum terdaftar sebagai '+role+'.');return}session={role,username:user.username};try{localStorage.setItem(SESSION_KEY,JSON.stringify(session))}catch{}page='home';render()}
function doRegister(form){
 const data=Object.fromEntries(new FormData(form));Object.keys(data).forEach(k=>{if(k!=='password')data[k]=data[k].trim()});
 if(!roles[data.role])return;if(!data.namaLengkap||!data.username||!data.password.trim())return formError('Nama, username, dan password wajib diisi.');
 if(!usernameValid(data.username))return formError('Username sudah digunakan atau mengandung karakter tidak valid.');
 if(data.role!=='admin'&&!data.kelas)return formError('Kelas wajib diisi.');
 if(data.role==='admin'){
  data.email=data.email.toLowerCase();if(!/^[^@\s]+@students\.um\.ac\.id$/.test(data.email))return formError('Email admin wajib menggunakan domain '+ADMIN_EMAIL_DOMAIN+'.');
  if(store('admin').some(a=>a.email===data.email))return formError('Email admin sudah terdaftar.');
 }
 const role=data.role;delete data.role;const rec=Object.assign({namaWali:'',nisn:'',asalSekolah:'',alamat:'',noHp:'',agama:'',jenisKelamin:'',mapel:'',jadwal:'',kelas:''},data);
 store(role).push(rec);if(!saveState()){store(role).pop();return}renderAuth('login',role);notify('Akun berhasil dibuat. Silakan login.');
}
function logout(){activeSection=null;stopCamera();session=null;try{localStorage.removeItem(SESSION_KEY)}catch{}renderAuth()}
/* Pengumuman: semua peran membaca, guru/admin menambah, hanya admin menghapus. */
function announcementPanel(){return `<section class="card"><div class="row spread"><h3>📢 Pengumuman</h3><span class="badge badge-orange">${state.announcements.length} pengumuman</span></div>${isStaff()?`<details><summary>+ Tambah Pengumuman</summary><form id="announcement-form">${field('announcement-title','Judul Pengumuman','','text','required maxlength="160"')}${area('announcement-body','Isi Pengumuman','','required maxlength="10000"')}<button type="submit" class="btn-primary">Terbitkan Pengumuman</button></form></details>`:''}${state.announcements.length?state.announcements.slice().reverse().map(a=>`<article class="soal-item announcement"><div class="row spread"><strong>${esc(a.title)}</strong>${session.role==='admin'?button('delete-announcement','Hapus','btn-danger-sm',`data-id="${esc(a.id)}"`):''}</div><div class="hint-text">${esc(a.authorName)} · ${roles[a.authorRole]||'Guru'} · ${esc(dateText(a.createdAt))}</div><div class="pre" style="margin-top:10px">${esc(a.body)}</div></article>`).join(''):empty('Belum ada pengumuman.')}</section>`}
function addAnnouncement(form){if(!requireRole('guru','admin'))return;const d=new FormData(form),title=String(d.get('announcement-title')).trim(),body=String(d.get('announcement-body')).trim();if(!title||!body)return notify('Judul dan isi pengumuman wajib diisi.');state.announcements.push({id:uid(),title,body,authorUsername:session.username,authorName:own().namaLengkap,authorRole:session.role,createdAt:new Date().toISOString()});if(saveState()){render();notify('Pengumuman diterbitkan.')}}
function deleteAnnouncement(id){if(!requireRole('admin'))return;if(!confirm('Hapus pengumuman ini?'))return;state.announcements=state.announcements.filter(a=>a.id!==id);saveState();render()}
function stat(number,label){return `<div class="stat-card"><div class="stat-num">${number}</div><div class="stat-label">${label}</div></div>`}
function studentHome(){const u=session.username,p=getProgress(u),read=state.materi.filter(m=>p.materiRead.includes(m.id)).length,pct=state.materi.length?Math.round(read/state.materi.length*100):0;return `<div class="hero"><div><div class="greet">Halo, ${esc(own().namaLengkap)}! 👋</div><h1>ElearnMath</h1><p>Belajar Matematika dengan cara yang mudah, interaktif, dan menyenangkan.</p>${button('nav','Mulai Belajar','btn-accent','data-page="materi"')}</div><div class="hero-illustration">📊📐📈</div></div><div class="grid grid-4">${stat(read+' / '+state.materi.length,'📚 Materi dibaca')}${stat(finalGrade(u,'lkpd')??'—','📝 Nilai LKPD · tuntas ≥ '+state.settings.lkpdPassingGrade)}${stat(finalGrade(u,'latihan')??'—','✏️ Nilai latihan')}${stat(finalGrade(u,'evaluasi')??'—','🎯 Nilai evaluasi')}</div><div class="card"><h3>Progres belajar kamu</h3><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="muted">${pct}% dari seluruh materi selesai kamu pelajari.</div><div class="note">Kelas: ${esc(studentClasses(u).join(', ')||'Belum diisi')}<br>${lkpdPassed(u)?'✓ LKPD tuntas. Latihan terbuka.':esc(gateReason('latihan'))}<br>Deadline evaluasi: ${esc(dateText(state.settings.evaluasiDeadline))}</div></div>${announcementPanel()}${feedbackPanel(u)}`}
function feedbackPanel(u){const sections=['lkpd','latihan','evaluasi'].filter(s=>getSubmission(u,s));return `<section class="card"><h3>Feedback Pengerjaan</h3><p class="muted">Nilai, jawaban pilihan ganda, dan catatan koreksi guru.</p>${sections.length?sections.map(s=>{const sub=getSubmission(u,s),g=finalGrade(u,s);return `<details open><summary>${labels[s]} <span class="badge ${g===null?'badge-orange':'badge-blue'}">${g===null?'Menunggu koreksi':'Nilai: '+g+'/100'}</span></summary>${sub.submittedAt?`<p class="hint-text">Dikirim ${esc(dateText(sub.submittedAt))}</p>`:''}${sub.pgScore!=null?`<p class="hint-text">Nilai pilihan ganda: ${sub.pgScore}/100</p>`:''}${(sub.pgFeedback||[]).map(f=>`<div class="soal-item"><span class="badge ${f.correct?'badge-green':'badge-red'}">${f.correct?'✓ Benar':'Belum tepat'}</span><p><strong>${f.number}. ${esc(f.prompt)}</strong></p><div>Jawabanmu: ${esc(f.answer)}</div>${!f.correct?`<div>Jawaban benar: ${esc(f.expected)}</div>`:''}<div class="note pre">${esc(f.feedback)}</div></div>`).join('')}${Object.entries(sub.essays||{}).map(([i,e])=>`<div class="soal-item"><strong>${Number(i)+1}. ${esc(e.prompt)}</strong><p class="pre">${esc(e.answer||'Jawaban foto')}</p>${e.photo&&safeImage(e.photo)?`<div class="photo-preview"><img src="${esc(safeImage(e.photo))}" alt="Foto jawabanmu"></div>`:''}<span class="badge ${e.corrected?'badge-green':'badge-orange'}">${e.corrected?'Skor essay: '+esc(e.score)+'/100':'Menunggu koreksi guru'}</span><div class="note pre">${esc(e.corrected?(e.feedback||'Guru belum menambahkan catatan.'):'Feedback muncul setelah guru menyimpan koreksi.')}</div></div>`).join('')}${!sub.pgFeedback?.length&&!Object.keys(sub.essays||{}).length?'<div class="note">Detail jawaban pengerjaan lama belum tersimpan.</div>':''}</details>`}).join(''):empty('Belum ada feedback. Kirim pengerjaanmu terlebih dahulu.')}</section>`}
function materialList(){return header('Pilih materi yang ingin kamu pelajari','Materi dapat diakses kapan saja, termasuk saat mengulang pembelajaran.','Materi')+`<div class="grid grid-3">${state.materi.length?state.materi.map(m=>`<button type="button" class="card materi-card" data-action="open-material" data-id="${esc(m.id)}"><div class="icon-circle">${esc(m.icon)}</div><h3>${esc(m.title)}</h3><p class="muted">${esc(m.desc)}</p><span class="badge badge-orange">${m.subbab.length} sub-bab</span> ${getProgress(session.username).materiRead.includes(m.id)?'<span class="badge badge-green">✓ Sudah dibaca</span>':''}</button>`).join(''):empty('Guru belum menambahkan materi.')}</div>`}
function openMaterial(id){if(!requireRole('siswa'))return;const m=state.materi.find(x=>x.id===id);if(!m)return;currentMaterial=id;const p=getProgress(session.username);if(!p.materiRead.includes(id))p.materiRead.push(id);saveState();go('materi-detail')}
function materialDetail(){const m=state.materi.find(x=>x.id===currentMaterial);if(!m)return materialList();return button('nav','← Kembali ke daftar materi','btn-outline-sm','data-page="materi"')+`<div class="card" style="margin-top:16px"><div class="icon-circle">${esc(m.icon)}</div><h2>${esc(m.title)}</h2><p class="muted">${esc(m.desc)}</p>${m.subbab.map(s=>`<div class="subbab-item">✓ ${esc(s)}</div>`).join('')}<div class="row" style="margin-top:16px">${linksHTML(m)}</div><div class="row spread" style="margin-top:24px">${button('material-prev','Materi Sebelumnya','btn-secondary')}${button('material-next','Materi Selanjutnya')}</div></div>`}
function materialEditor(){const m=state.materi.find(x=>x.id===editId)||{icon:'📘',title:'',desc:'',subbab:[],links:[]};return header('Kelola Materi','Tambah materi, sub-bab, dan beberapa link pembelajaran.','Kelola Pembelajaran')+`<div class="card soal-form-card"><h3>${editId?'Edit Materi':'Tambah Materi Baru'}</h3><form id="material-form">${field('mt-icon','Ikon (emoji)',m.icon)}${field('mt-title','Judul Materi',m.title,'text','required')}${area('mt-desc','Deskripsi Singkat',m.desc)}${field('mt-subbab','Sub-bab (pisahkan dengan koma)',m.subbab.join(', '))}${area('mt-links','Link Materi (opsional)',m.links.join('\n'),'placeholder="https://youtube.com/...&#10;https://drive.google.com/..."')}<p class="hint-text">Satu link per baris. Mendukung video, dokumen PDF, Google Drive, dan website materi.</p>${errorBox()}<div class="row"><button type="submit" class="btn-primary">Simpan Materi</button>${editId?button('cancel-edit','Batalkan Edit','btn-secondary'):''}</div></form></div><div class="card"><h3>Daftar Materi</h3>${state.materi.length?state.materi.map(m=>`<div class="soal-item"><div class="row spread"><strong>${esc(m.icon)} ${esc(m.title)}</strong><div class="row">${button('edit-material','Edit','btn-outline-sm',`data-id="${esc(m.id)}"`)}${button('delete-material','Hapus','btn-danger-sm',`data-id="${esc(m.id)}"`)}</div></div><p>${esc(m.desc)}</p>${m.subbab.map(s=>`<span class="tag-pill">${esc(s)}</span>`).join('')}<div class="row" style="margin-top:10px">${linksHTML(m)}</div></div>`).join(''):empty('Belum ada materi.')}</div>`}
function saveMaterial(form){if(!requireRole('guru'))return;const d=new FormData(form),title=String(d.get('mt-title')).trim(),links=parseLinks(d.get('mt-links'));if(!title)return formError('Judul materi wajib diisi.');if(links.some(l=>!safeURL(l)))return formError('Setiap link harus lengkap dengan https:// atau http://.');const m={id:editId||uid(),icon:String(d.get('mt-icon')).trim()||'📘',title,desc:String(d.get('mt-desc')).trim(),subbab:String(d.get('mt-subbab')).split(',').map(s=>s.trim()).filter(Boolean),links,yt:links[0]||null};const i=state.materi.findIndex(x=>x.id===editId);if(i<0)state.materi.push(m);else state.materi[i]=m;saveState();editId=null;render();notify('Materi tersimpan.')}
/* Editor soal, ketuntasan LKPD, dan deadline evaluasi. */
function settingsPanel(key){
 if(key==='kpd')return `<div class="card"><h3>Batas Ketuntasan LKPD</h3><form id="passing-form">${field('passing-grade','Nilai Minimal Ketuntasan (0–100)',state.settings.lkpdPassingGrade,'number','min="0" max="100" step="1" required')}<p class="hint-text">Latihan hanya terbuka setelah LKPD dikirim dan nilai final mencapai batas ini. Semua essay harus dikoreksi. Perubahan batas berlaku untuk seluruh siswa.</p><button type="submit" class="btn-primary">Simpan Batas Ketuntasan</button></form></div>`;
 if(key==='evaluasi')return `<div class="card"><h3>Deadline Evaluasi</h3><form id="deadline-form">${field('evaluasi-deadline','Batas Waktu Pengumpulan',localDateValue(state.settings.evaluasiDeadline),'datetime-local')}<p class="hint-text">Zona waktu perangkat: ${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}. Kosongkan jika tidak ada deadline. Guru dapat memperpanjang atau mengubahnya kapan saja; berlaku untuk seluruh siswa.</p><div class="note">Deadline saat ini: ${esc(dateText(state.settings.evaluasiDeadline))}</div><button type="submit" class="btn-primary" style="margin-top:12px">Simpan Deadline</button></form></div>`;
 return '';
}
function questionEditor(key){

async function imageFile(file){if(!file||!/^image\/(png|jpeg|webp|gif)$/.test(file.type))throw Error('Pilih file gambar PNG, JPEG, WebP, atau GIF.');if(file.size>12*1024*1024)throw Error('Ukuran gambar maksimal 12 MB.');const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Gambar tidak dapat dibaca.'));img.src=url});const factor=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*factor);canvas.height=Math.round(img.naturalHeight*factor);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.78)}finally{URL.revokeObjectURL(url)}}

function moveUsername(oldName,newName,role){if(oldName===newName)return;if(role==='siswa'){for(const key of ['progress','grades','submissions','drafts'])if(state[key][oldName]){state[key][newName]=state[key][oldName];delete state[key][oldName]}state.classes.forEach(c=>c.studentUsernames=c.studentUsernames.map(u=>u===oldName?newName:u));state.flagged.forEach(f=>{if(f.username===oldName||(!f.username&&f.name===oldName)){f.username=newName;f.name=newName}})}if(role==='guru')state.classes.forEach(c=>{if(c.teacherUsername===oldName)c.teacherUsername=newName});state.announcements.forEach(a=>{if(a.authorUsername===oldName)a.authorUsername=newName})}
function saveUser(form,profile=false){
 if(profile){if(!session||!own())return}else if(!requireRole('admin'))return;
 const role=profile?session.role:form.dataset.role,rec=profile?own():store(role).find(x=>x.username===editId),data=Object.fromEntries(new FormData(form));Object.keys(data).forEach(k=>{if(k!=='password')data[k]=data[k].trim()});
 if(!data.namaLengkap||!data.username||!data.password.trim())return formError('Nama, username, dan password wajib diisi.');if(!usernameValid(data.username,rec))return formError('Username sudah dipakai atau mengandung karakter tidak valid.');if(role!=='admin'&&!data.kelas)return formError('Kelas wajib diisi.');
 if(role==='admin'){data.email=data.email.toLowerCase();if(!/^[^@\s]+@students\.um\.ac\.id$/.test(data.email))return formError('Email admin wajib menggunakan domain '+ADMIN_EMAIL_DOMAIN+'.');if(store('admin').some(a=>a!==rec&&a.email===data.email))return formError('Email sudah terdaftar.');}
 const old=rec?.username;if(rec)Object.assign(rec,data);else store(role).push(data);if(old)moveUsername(old,data.username,role);
 if(profile){session.username=data.username;try{localStorage.setItem(SESSION_KEY,JSON.stringify(session))}catch{}}
 saveState();editId=null;if(!profile)page='users';render();notify('Data tersimpan.');
}

function deleteUser(role,u){if(!requireRole('admin')||!['guru','siswa'].includes(role))return;if(!confirm('Hapus akun dan data terkait '+u+'?'))return;const rec=store(role).find(x=>x.username===u);if(!rec)return;state.users[role==='guru'?'gurus':'siswas']=store(role).filter(x=>x.username!==u);state.classes.forEach(c=>{if(role==='guru'&&c.teacherUsername===u)c.teacherUsername='';if(role==='siswa')c.studentUsernames=c.studentUsernames.filter(x=>x!==u)});if(role==='siswa'){['grades','progress','submissions','drafts'].forEach(k=>delete state[k][u]);state.flagged=state.flagged.filter(f=>f.username!==u&&f.name!==u)}saveState();render()}
function classesPage(){const c=state.classes.find(x=>x.id===editId)||{name:'',teacherUsername:'',studentUsernames:[]};return header(editId?'Edit Kelas':'Tambah Kelas Baru','Atur guru dan anggota kelas. Nama kelas manual pada profil juga digunakan untuk menghubungkan guru dan siswa.','Manajemen Kelas')+`<div class="card soal-form-card"><form id="class-form">${field('class-name','Nama Kelas',c.name,'text','required')}<div class="field"><label for="class-teacher">Guru Pengajar</label><select id="class-teacher" name="teacher"><option value="">Belum ditentukan</option>${store('guru').map(g=>`<option value="${esc(g.username)}" ${g.username===c.teacherUsername?'selected':''}>${esc(g.namaLengkap)}</option>`).join('')}</select></div><div class="field"><label>Siswa Anggota Kelas</label><div class="checklist-scroll">${store('siswa').length?store('siswa').map(s=>`<label><input type="checkbox" name="students" value="${esc(s.username)}" ${c.studentUsernames.includes(s.username)?'checked':''}>${esc(s.namaLengkap)} (${esc(s.kelas||s.nisn||'belum ada kelas')})</label>`).join(''):'Belum ada siswa.'}</div></div>${errorBox()}<div class="row"><button class="btn-primary" type="submit">Simpan Kelas</button>${editId?button('cancel-edit','Batalkan Edit','btn-secondary'):''}</div></form></div><div class="card"><h3>Daftar Kelas</h3>${state.classes.length?state.classes.map(c=>`<div class="soal-item"><div class="row spread"><strong>Kelas ${esc(c.name)} <span class="badge badge-blue">${c.studentUsernames.length} anggota</span></strong><div class="row">${button('edit-class','Edit','btn-outline-sm',`data-id="${esc(c.id)}"`)}${button('delete-class','Hapus','btn-danger-sm',`data-id="${esc(c.id)}"`)}</div></div><p class="hint-text">Guru: ${esc(store('guru').find(g=>g.username===c.teacherUsername)?.namaLengkap||'Belum ditentukan')}</p>${c.studentUsernames.map(u=>`<span class="tag-pill">${esc(store('siswa').find(s=>s.username===u)?.namaLengkap||u)}</span>`).join('')}</div>`).join(''):empty('Belum ada kelas ditambahkan.')}</div>`}
function saveClass(form){if(!requireRole('admin'))return;const d=new FormData(form),name=String(d.get('class-name')).trim();if(!name)return formError('Nama kelas wajib diisi.');if(state.classes.some(c=>c.id!==editId&&normClass(c.name)===normClass(name)))return formError('Nama kelas sudah ada.');const teacher=String(d.get('teacher'));if(teacher&&!store('guru').some(g=>g.username===teacher))return formError('Guru tidak ditemukan.');const c={id:editId||uid(),name,teacherUsername:teacher,studentUsernames:d.getAll('students').filter(u=>store('siswa').some(s=>s.username===u))};const i=state.classes.findIndex(x=>x.id===editId);if(i<0)state.classes.push(c);else state.classes[i]=c;saveState();editId=null;render();notify('Kelas tersimpan.')}
/* Koreksi essay: saran berbasis panjang teks hanyalah simulasi, guru menetapkan nilai. */
function correctionPage(){const students=teacherStudents();let count=0;const cards=students.map(student=>['lkpd','latihan','evaluasi'].map(section=>Object.entries(getSubmission(student.username,section)?.essays||{}).map(([i,e])=>{count++;return `<div class="card"><div class="row"><strong>${esc(student.namaLengkap)}</strong><span class="badge badge-blue">${labels[section]}</span><span class="badge ${e.corrected?'badge-green':'badge-orange'}">${e.corrected?'Sudah dikoreksi':'Belum dikoreksi'}</span></div><h3 style="margin-top:14px">${Number(i)+1}. ${esc(e.prompt)}</h3><div class="note pre">${esc(e.answer||'(Jawaban foto)')}</div>${e.photo&&safeImage(e.photo)?`<div class="photo-preview"><img src="${esc(safeImage(e.photo))}" alt="Jawaban foto siswa"></div>`:''}<form class="correction-form" data-user="${esc(student.username)}" data-section="${section}" data-index="${esc(i)}"><div class="field" style="margin-top:12px"><label>Skor (0–100)<input aria-label="Skor jawaban ${esc(student.namaLengkap)} nomor ${Number(i)+1}" name="score" type="number" min="0" max="100" step="any" value="${esc(e.score??'')}" required></label></div><div class="field"><label>Catatan / Feedback untuk Siswa<textarea aria-label="Feedback jawaban" name="feedback" rows="3">${esc(e.feedback||'')}</textarea></label></div><div class="row">${button('suggest-correction','🤖 Saran Koreksi (Simulasi)','btn-secondary',`data-user="${esc(student.username)}" data-section="${section}" data-index="${esc(i)}"`)}<button type="submit" class="btn-primary">Simpan Koreksi</button></div></form></div>`}).join('')).join('')).join('');return header('Koreksi Jawaban Essay / HOTS','Nilai final dihitung setelah seluruh essay pada tahap tersebut dikoreksi. Feedback langsung tersedia pada beranda siswa di browser ini.','Koreksi Jawaban')+`<div class="note" style="margin-bottom:18px">Saran otomatis adalah simulasi berdasarkan panjang teks, bukan AI penilai matematika. Foto wajib diperiksa manual. Tinjau isi jawaban sebelum menetapkan nilai. Jika ada PG dan essay, nilai final = rata-rata nilai PG dan rata-rata nilai essay (bobot masing-masing 50%).</div>`+(count?cards:empty('Belum ada jawaban essay dari siswa di kelasmu.'))}
function suggestCorrection(btn){if(!requireRole('guru')||!canViewStudent(btn.dataset.user))return;const e=getSubmission(btn.dataset.user,btn.dataset.section)?.essays[btn.dataset.index];if(!e)return;const form=btn.closest('form'),words=String(e.answer||'').trim().split(/\s+/).filter(Boolean);if(!words.length||e.answer==='[jawaban foto]'){form.elements.score.value='';form.elements.feedback.value='Jawaban foto perlu diperiksa manual. Tentukan skor berdasarkan ketepatan langkah dan hasil.';return}form.elements.score.value=Math.min(95,50+Math.min(words.length,15)*3);form.elements.feedback.value='Saran simulasi (periksa ketepatan matematika): '+(words.length<6?'Jawaban perlu penjelasan lebih rinci dan contoh.':words.length<20?'Lengkapi penjelasan atau contoh untuk memperjelas jawaban.':'Periksa kembali ketepatan konsep, langkah, dan hasil perhitungan.');notify('Saran belum disimpan. Tinjau dahulu, lalu klik Simpan Koreksi.')}
function saveCorrection(form){if(!requireRole('guru')||!canViewStudent(form.dataset.user))return;const d=new FormData(form),score=Number(d.get('score')),u=form.dataset.user,section=form.dataset.section,i=form.dataset.index;if(String(d.get('score')).trim()===''||!Number.isFinite(score)||score<0||score>100)return notify('Isi skor 0–100.');const sub=getSubmission(u,section);if(!sub?.essays[i])return;Object.assign(sub.essays[i],{score,feedback:String(d.get('feedback')).trim(),corrected:true,correctedBy:session.username,correctedAt:new Date().toISOString()});recomputeFinalGrade(u,section);saveState();render();notify('Koreksi tersimpan. Feedback siswa diperbarui.')}
function gradesPage(){const students=teacherStudents();return header('Daftar Nilai Siswa','Nilai final, ekspor, dan sinkron Google Sheets.','Nilai Siswa')+`<div class="card">${students.length?`<div class="table-scroll"><table><thead><tr><th>Nama</th><th>NISN</th><th>LKPD</th><th>Latihan</th><th>Evaluasi</th><th>Aksi</th></tr></thead><tbody>${students.map((s,index)=>`<tr><td>${esc(s.namaLengkap)}</td><td>${esc(s.nisn||'—')}</td>${['lkpd','latihan','evaluasi'].map(k=>`<td><input aria-label="Nilai ${k} ${esc(s.namaLengkap)}" id="grade-${index}-${k}" type="number" min="0" max="100" step="any" value="${finalGrade(s.username,k)??''}" ${pendingEssays(s.username,k)?'disabled':''}>${pendingEssays(s.username,k)?'<span class="hint-text">Menunggu koreksi essay</span>':''}</td>`).join('')}<td>${button('save-grades','Simpan','btn-outline-sm',`data-user="${esc(s.username)}" data-index="${index}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada siswa di kelasmu.')}<p class="hint-text">Koreksi seluruh essay terlebih dahulu sebelum mengubah nilai final. Nilai LKPD saja tidak menggantikan kewajiban siswa mengirim jawaban.</p>${button('export-grades','Unduh Nilai CSV (Excel)','btn-secondary')}</div><div class="card"><h3>Sinkron ke Google Sheets</h3><form id="sheets-form">${field('gs-url','URL Web App Google Apps Script',state.googleSheet.webAppUrl,'url','placeholder="https://script.google.com/macros/s/xxxx/exec"')}<button type="submit" class="btn-primary">Simpan Koneksi</button> ${button('sync-sheets','🔄 Sinkron Sekarang','btn-accent')}</form><div id="gs-status" class="note">${state.googleSheet.lastSync?'Pengiriman terakhir: '+esc(dateText(state.googleSheet.lastSync)):'Belum ada pengiriman.'}</div><details><summary>Contoh Skrip Apps Script</summary><p class="hint-text">Pada Google Sheet, buka Extensions → Apps Script. Tempel skrip, deploy sebagai Web App dengan akses yang memungkinkan pengiriman dari halaman ini. Setiap sinkron memperbarui baris berdasarkan username.</p><pre class="note pre">${esc(`function doPost(e) {
  var payload = JSON.parse(e.postData.contents);
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var lock = LockService.getScriptLock();
  lock.waitLock(10000);
  try {
    if (sheet.getLastRow() === 0) sheet.appendRow(['Username','Nama','NISN','Kelas','LKPD','Latihan','Evaluasi']);
    var existing = sheet.getDataRange().getValues();
    function safe(v) { return typeof v === 'string' && /^[=+@-]/.test(v) ? "'" + v : v; }
    payload.rows.forEach(function(r) {
      var row = [r.username,r.nama,r.nisn,r.kelas,r.lkpd,r.latihan,r.evaluasi].map(safe);
      var index = existing.findIndex(function(x) { return x[0] === r.username; });
      if (index > 0) sheet.getRange(index + 1,1,1,row.length).setValues([row]);
      else { sheet.appendRow(row); existing.push(row); }
    });
    return ContentService.createTextOutput('OK');
  } finally { lock.releaseLock(); }
}`)}</pre></details></div>`}
function saveGrades(u,index){if(!requireRole('guru')||!canViewStudent(u))return;const patch={};for(const k of ['lkpd','latihan','evaluasi']){const el=$('grade-'+index+'-'+k);if(!el||el.disabled)continue;const raw=el.value.trim(),v=raw===''?null:Number(raw);if(v!==null&&(!Number.isFinite(v)||v<0||v>100))return notify('Semua nilai harus 0–100.');patch[k]=v}Object.assign(getGrades(u),patch);saveState();notify('Nilai tersimpan.')}
function gradeRows(){return teacherStudents().map(s=>({username:s.username,nama:s.namaLengkap,nisn:s.nisn||'',kelas:studentClasses(s.username).join(', '),lkpd:finalGrade(s.username,'lkpd')??'',latihan:finalGrade(s.username,'latihan')??'',evaluasi:finalGrade(s.username,'evaluasi')??''}))}
async function syncSheets(){if(!requireRole('guru'))return;const url=state.googleSheet.webAppUrl,el=$('gs-status');if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url))return el.textContent='Simpan URL Web App Google Apps Script yang valid terlebih dahulu.';el.textContent='Mengirim nilai...';try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rows:gradeRows()})});state.googleSheet.lastSync=new Date().toISOString();saveState();el.textContent='Permintaan pengiriman selesai. Browser tidak dapat memverifikasi respons Apps Script; periksa Google Sheet untuk memastikan data masuk.'}catch{el.textContent='Pengiriman gagal. Periksa koneksi dan URL Web App.'}}
function downloadFile(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportGrades(){if(!requireRole('guru'))return;const keys=['username','nama','nisn','kelas','lkpd','latihan','evaluasi'],cell=v=>'"'+String(typeof v==='string'&&/^[=+@-]/.test(v)?"'"+v:v).replace(/"/g,'""')+'"';downloadFile('Nilai-ElearnMath.csv','\ufeff'+[keys.map(cell).join(','),...gradeRows().map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')}
function detectionPage(){const allowed=new Set(teacherStudents().map(s=>s.username)),rows=session.role==='admin'?state.flagged:state.flagged.filter(f=>allowed.has(f.username||f.name));return header('Siswa Terdeteksi Keluar dari Tab','Catatan perpindahan tab saat pengerjaan, bukan bukti penggunaan AI atau kecurangan.','Pemantauan Pengerjaan')+`<div class="card">${rows.length?`<div class="table-scroll"><table><thead><tr><th>Siswa</th><th>Aktivitas</th><th>Jumlah</th><th>Terakhir</th></tr></thead><tbody>${rows.map(f=>`<tr><td>${esc(store('siswa').find(s=>s.username===(f.username||f.name))?.namaLengkap||f.name)}</td><td>${esc(f.activity)}</td><td><span class="badge badge-red">${f.count}x</span></td><td>${f.lastAt?esc(dateText(f.lastAt)):'—'}</td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada aktivitas keluar tab yang terdeteksi.')}</div>`}
/* Event handlers terpusat. Semua masukan pengguna di-escape saat ditampilkan. */
document.addEventListener('click',async event=>{
 const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 try{
 if(a==='auth-back')return renderAuth();if(a==='login-page')return renderAuth('login',b.dataset.role);if(a==='register-page')return renderAuth('register',b.dataset.role);if(a==='logout')return logout();if(a==='nav')return go(b.dataset.page);
 if(a==='close-camera')return stopCamera();if(a==='capture')return capturePhoto();
 if(!session||!own())return;
 if(a==='delete-announcement')return deleteAnnouncement(b.dataset.id);
 if(a==='open-material')return openMaterial(b.dataset.id);
 if(a==='material-prev'||a==='material-next'){const i=state.materi.findIndex(m=>m.id===currentMaterial),next=(i+(a==='material-next'?1:-1)+state.materi.length)%state.materi.length;return openMaterial(state.materi[next]?.id)}
 if(a==='cancel-edit'){editId=null;questionDraft=null;render();return}
 if(a==='edit-material'){if(!requireRole('guru'))return;editId=b.dataset.id;render();window.scrollTo(0,0);return}
 if(a==='delete-material'){if(!requireRole('guru')||!confirm('Hapus materi ini?'))return;state.materi=state.materi.filter(m=>m.id!==b.dataset.id);saveState();editId=null;render();return}
 if(a==='edit-question'){if(!requireRole('guru'))return;editId=b.dataset.id;questionDraft=null;render();window.scrollTo(0,0);return}
 if(a==='delete-question'){if(!requireRole('guru')||!['kpd','latihan','evaluasi'].includes(b.dataset.key)||!confirm('Hapus soal ini? Pengerjaan yang sudah dimulai tidak berubah.'))return;state[b.dataset.key]=state[b.dataset.key].filter(q=>q.id!==b.dataset.id);saveState();editId=null;questionDraft=null;render();return}
 if(a==='start-assessment')return startAssessment(b.dataset.section);
 if(a==='choose-answer')return chooseAnswer(b.dataset.section,Number(b.dataset.index),Number(b.dataset.option));
 if(a==='practice-prev')return practiceNav(-1);if(a==='practice-next')return practiceNav(1);
 if(a==='submit-assessment')return submitAssessment(b.dataset.section);
 if(a==='camera')return openCamera(b.dataset.section,Number(b.dataset.index));
 if(a==='remove-photo'){if(!canAnswer(b.dataset.section))return;delete getDraft(b.dataset.section).photos[b.dataset.index];saveState();render();return}
 if(a==='edit-user'){if(!requireRole('admin'))return;page=b.dataset.role+'-editor';editId=b.dataset.id;render();window.scrollTo(0,0);return}
 if(a==='delete-user')return deleteUser(b.dataset.role,b.dataset.id);
 if(a==='edit-class'){if(!requireRole('admin'))return;editId=b.dataset.id;render();window.scrollTo(0,0);return}
 if(a==='delete-class'){if(!requireRole('admin')||!confirm('Hapus kelas ini?'))return;state.classes=state.classes.filter(c=>c.id!==b.dataset.id);saveState();editId=null;render();return}
 if(a==='suggest-correction')return suggestCorrection(b);
 if(a==='save-grades')return saveGrades(b.dataset.user,Number(b.dataset.index));
 if(a==='sync-sheets')return syncSheets();if(a==='export-grades')return exportGrades();
 if(a==='backup'){if(!requireRole('admin'))return;downloadFile('Cadangan-ElearnMath-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');return}
 }catch(error){console.error(error);notify('Terjadi kesalahan. Periksa kembali data yang diisi.');}
});
document.addEventListener('submit',event=>{
 event.preventDefault();const f=event.target;
 try{
 if(f.id==='login-form')return doLogin(f);if(f.id==='register-form')return doRegister(f);
 if(f.id==='announcement-form')return addAnnouncement(f);
 if(f.id==='material-form')return saveMaterial(f);if(f.id==='question-form')return saveQuestion(f);
 if(f.id==='profile-form')return saveUser(f,true);if(f.id==='user-form')return saveUser(f,false);if(f.id==='class-form')return saveClass(f);
 if(f.classList.contains('correction-form'))return saveCorrection(f);
 if(f.id==='passing-form'){if(!requireRole('guru'))return;const raw=$('passing-grade').value,v=Number(raw);if(!raw||!Number.isInteger(v)||v<0||v>100)return notify('Batas ketuntasan harus bilangan bulat 0–100.');state.settings.lkpdPassingGrade=v;saveState();notify('Batas ketuntasan LKPD disimpan.');return}
 if(f.id==='deadline-form'){if(!requireRole('guru'))return;const raw=$('evaluasi-deadline').value;if(raw&&Number.isNaN(new Date(raw).getTime()))return notify('Tanggal deadline tidak valid.');state.settings.evaluasiDeadline=raw?new Date(raw).toISOString():null;saveState();render();notify('Deadline evaluasi disimpan.');return}
 if(f.id==='sheets-form'){if(!requireRole('guru'))return;const url=$('gs-url').value.trim();if(url&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url))return notify('Gunakan URL Web App Google Apps Script berakhiran /exec.');state.googleSheet.webAppUrl=url;saveState();notify('Koneksi disimpan.');return}
 }catch(error){console.error(error);formError('Data belum dapat diproses. Periksa kembali isian.');}
});
document.addEventListener('input',event=>{const e=event.target;if(e.dataset.answer!==undefined){const section=e.dataset.section;if(!canAnswer(section))return;getDraft(section).answers[e.dataset.answer]=e.value;saveState();updateAnswerProgress(section)}});
document.addEventListener('change',async event=>{
 const e=event.target;
 try{
 if(e.id==='reg-role'){const f=$('register-form'),d=Object.fromEntries(new FormData(f));renderAuth('register',e.value);for(const [k,v] of Object.entries(d)){if(k==='role')continue;const el=$('register-form').elements.namedItem(k);if(el)el.value=v}return}
 if(e.id==='q-type'||e.id==='q-format'){captureQuestion();render();return}
 if(e.id==='q-upload'){if(!requireRole('guru')||!e.files[0])return;const photo=await imageFile(e.files[0]);captureQuestion();questionDraft.media=photo;render();return}
 if(e.dataset.photo!==undefined){const section=e.dataset.section,index=Number(e.dataset.photo);if(!canAnswer(section)||!e.files[0])return;const user=session.username,attempt=getDraft(section).id,photo=await imageFile(e.files[0]);if(session?.username!==user||getDraft(section)?.id!==attempt)return;putPhoto(section,index,photo);return}
 if(e.id==='restore-file'){if(!requireRole('admin')||!e.files[0])return;const raw=JSON.parse(await e.files[0].text());if(!raw.users||!Array.isArray(raw.users.admins)||!Array.isArray(raw.materi)||!Array.isArray(raw.kpd)||!Array.isArray(raw.latihan)||!Array.isArray(raw.evaluasi))throw Error('Struktur cadangan tidak valid.');const restored=normalizeState(raw);if(!confirm('Pemulihan mengganti seluruh data pada browser ini. Lanjutkan?'))return;const previous=state;state=restored;if(!saveState()){state=previous;return}logout();notify('Cadangan dipulihkan. Silakan login kembali.');return}
 }catch(error){notify(error.message||'File tidak dapat diproses.');}
});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&session?.role==='siswa'&&activeSection&&page===activeSection&&getDraft(activeSection)&&!gateReason(activeSection)&&!(activeSection==='evaluasi'&&deadlinePassed())){
  const activity=labels[activeSection]+' Bab Statistika',u=session.username;let f=state.flagged.find(x=>(x.username||x.name)===u&&x.activity===activity);if(f){f.count++;f.lastAt=new Date().toISOString()}else state.flagged.push({username:u,name:u,activity,count:1,lastAt:new Date().toISOString()});saveState();if($('tab-warning'))$('tab-warning').classList.remove('hidden');
 }
 if(!document.hidden)updateDeadlineUI();
});
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue){try{state=normalizeState(JSON.parse(event.newValue));if(session&&!own()){logout();return}if(session&&['home','lkpd','latihan','evaluasi','koreksi','nilai','deteksi'].includes(page))render()}catch{notify('Perubahan data dari tab lain belum dapat dibaca.')}}});
$('camera-dialog').addEventListener('cancel',()=>stopCamera());
window.addEventListener('pagehide',()=>{stopCamera()});
setInterval(updateDeadlineUI,1000);
loadState();
try{const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(saved&&roles[saved.role]&&store(saved.role).some(u=>u.username===saved.username))session=saved}catch{}
if(session){page='home';render()}else renderAuth();
</script>
